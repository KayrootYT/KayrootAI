name: Kayroot Engine Android CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kayroot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find . \
            -name settings.gradle.kts \
            -not -path '*/.git/*' \
            -not -path '*/build/*' \
            -not -path '*/_unzipped_project/*' \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            mkdir -p _unzipped_project

            shopt -s nullglob
            ZIP_FILES=(./*.zip)

            for ZIP in "${ZIP_FILES[@]}"; do
              unzip -oq "$ZIP" -d _unzipped_project
            done

            PROJECT_FILE="$(find _unzipped_project \
              -name settings.gradle.kts \
              -not -path '*/build/*' \
              -print -quit)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Android project not found."
            echo "Commit the extracted project files or put the project ZIP in the repository root."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found."
            exit 1
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KS" ] || [ -z "$KSP" ] || \
             [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Release tags require all four signing secrets."
            exit 1
          fi

      - name: Prepare signing
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$KS" ] || [ -n "$KSP" ] || \
             [ -n "$KA" ] || [ -n "$KP" ]; then

            if [ -z "$KS" ] || [ -z "$KSP" ] || \
               [ -z "$KA" ] || [ -z "$KP" ]; then
              echo "::error::Incomplete signing secrets."
              exit 1
            fi

            KEYSTORE="$RUNNER_TEMP/kayroot-release.jks"
            printf '%s' "$KS" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"

            echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KSP" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KA" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KP" >> "$GITHUB_ENV"
            echo "APK_NAME=KayrootEngine-v2.4.apk" >> "$GITHUB_ENV"

          else
            echo "No release key: building a debug-signed test APK."
            echo "APK_NAME=KayrootEngine-v2.4-debug-signed.apk" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Build release variant
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$SOURCE"
          cp "$SOURCE" "$APK_NAME"

          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_NAME"
          sha256sum "$APK_NAME" | tee apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KayrootEngine-v2.4-apk
          path: |
            KayrootEngine-v2.4*.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KayrootEngine-v2.4.apk
            apk-sha256.txt
            
